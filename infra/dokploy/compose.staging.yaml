# WAJHATI staging for Dokploy (Docker Compose deployment). NOT deployed by this repository: nothing here runs until the
# owner creates the Dokploy project, sets the variables listed in infra/dokploy/README.md and deploys it.
#
# Isolation rules this file enforces:
#   * Its own project name, database (dar_staging), volumes, network and secrets. Nothing is shared with production.
#   * Every service receives only the variables it needs. The app never gets the mailer or worker logins, the worker never
#     gets mail secrets, and the mailer never gets storage or any other database login (scripts/ops/validate-env.mjs
#     enforces the same rules at start-up).
#   * Only the app is attached to the Traefik network. The database, renderer, worker and mailer are unreachable from outside.
#   * Access is protected by HTTP basic auth at the edge, and every response carries X-Robots-Tag: noindex.
#   * Mail can only go to MAIL_ALLOWED_RECIPIENTS, so staging can never reach a real merchant.
name: wajhati-staging

x-restricted: &restricted
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 25s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  app:
    <<: *restricted
    build: { context: ../.., target: app }
    environment:
      DAR_ENV: staging
      APP_ORIGIN: ${STAGING_ORIGIN:-https://staging.wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      LEGAL_APPROVED: "false"
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      DATABASE_URL: postgresql://dar_runtime:${DAR_RUNTIME_PASSWORD:?set DAR_RUNTIME_PASSWORD}@db:5432/dar_staging
      IDENTITY_DATABASE_URL: postgresql://dar_identity:${DAR_IDENTITY_PASSWORD:?set DAR_IDENTITY_PASSWORD}@db:5432/dar_staging
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET (dar-staging-media-...)}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (https)}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_READY_KEY: ops/readiness
      AWS_ACCESS_KEY_ID: ${S3_APP_ACCESS_KEY_ID:?set S3_APP_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_APP_SECRET_ACCESS_KEY:?set S3_APP_SECRET_ACCESS_KEY}
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?set PLATFORM_MFA_KEY}
      PAYMENT_PROOF_ACTIVE_KEY: ${PAYMENT_PROOF_ACTIVE_KEY:?set PAYMENT_PROOF_ACTIVE_KEY}
      PAYMENT_PROOF_KEYRING: ${PAYMENT_PROOF_KEYRING:?set PAYMENT_PROOF_KEYRING}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?set OPS_METRICS_TOKEN}
      SMTP_CONFIG_KEY: ${SMTP_CONFIG_KEY:?set SMTP_CONFIG_KEY}
      # WAJHATI AI (optional). Without DEEPSEEK_API_KEY the assistant shows "not set up" and never calls the provider or charges credits.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      MAIL_ALLOWED_RECIPIENTS: ${MAIL_ALLOWED_RECIPIENTS:?set MAIL_ALLOWED_RECIPIENTS}
      PAYMENT_RENDERER_SOCKET: /run/dar-pdf/worker.sock
    volumes:
      - pdf_socket:/run/dar-pdf:ro
    tmpfs:
      - "/tmp:size=64m,uid=10001,gid=10001"
      - "/app/.next/cache:size=64m,uid=10001,gid=10001"
    depends_on:
      db: { condition: service_healthy }
      pdf: { condition: service_healthy }
    networks: [data, egress, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS router. Basic auth first, so an unauthenticated visitor never reaches the application.
      - traefik.http.routers.wajhati-staging.rule=Host(`staging.wajhati.store`)
      - traefik.http.routers.wajhati-staging.entrypoints=websecure
      - traefik.http.routers.wajhati-staging.tls=true
      - traefik.http.routers.wajhati-staging.tls.certresolver=letsencrypt
      - traefik.http.routers.wajhati-staging.middlewares=wajhati-staging-auth,wajhati-staging-noindex
      - traefik.http.services.wajhati-staging.loadbalancer.server.port=3000
      - traefik.http.middlewares.wajhati-staging-auth.basicauth.users=${STAGING_BASIC_AUTH:?set STAGING_BASIC_AUTH (htpasswd hash)}
      - traefik.http.middlewares.wajhati-staging-auth.basicauth.removeheader=true
      - "traefik.http.middlewares.wajhati-staging-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow, noarchive"
      # Plain HTTP only redirects to HTTPS.
      - traefik.http.routers.wajhati-staging-http.rule=Host(`staging.wajhati.store`)
      - traefik.http.routers.wajhati-staging-http.entrypoints=web
      - traefik.http.routers.wajhati-staging-http.middlewares=wajhati-staging-https
      - traefik.http.middlewares.wajhati-staging-https.redirectscheme.scheme=https
      - traefik.http.middlewares.wajhati-staging-https.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128

  pdf:
    <<: *restricted
    build: { context: ../.., target: pdf }
    network_mode: none
    environment:
      PAYMENT_RENDERER_SOCKET: /run/dar-pdf/worker.sock
    volumes: [pdf_socket:/run/dar-pdf]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/pdf-worker.mjs", "--health"]
      interval: 20s
      timeout: 3s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 48

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: dar_admin
      POSTGRES_PASSWORD: ${DAR_DB_ADMIN_PASSWORD:?set DAR_DB_ADMIN_PASSWORD}
      POSTGRES_DB: dar_staging
    command: ["postgres", "-c", "max_connections=55", "-c", "shared_buffers=128MB", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    volumes: [db_data:/var/lib/postgresql]
    networks: [data]
    shm_size: 192m
    mem_limit: 1024m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dar_admin -d dar_staging"]
      interval: 10s
      timeout: 4s
      retries: 10

  # Media cleanup, order retention, billing expiry, maintenance. No mail secrets and no mail login.
  worker:
    <<: *restricted
    build: { context: ../.., target: operations }
    environment:
      DAR_ENV: staging
      APP_ORIGIN: ${STAGING_ORIGIN:-https://staging.wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      MEDIA_WORKER_DATABASE_URL: postgresql://dar_worker:${DAR_WORKER_PASSWORD:?set DAR_WORKER_PASSWORD}@db:5432/dar_staging
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?set S3_WORKER_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?set S3_WORKER_SECRET_ACCESS_KEY}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_ALERT_KEY: ${DAR_ALERT_KEY:-}
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/scheduler.mjs", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 45s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 80

  # Sends the queued notification email through the owner-managed SMTP (or Resend). Its own database login and the SMTP key,
  # nothing else. MAIL_ALLOWED_RECIPIENTS keeps it away from real merchants.
  mailer:
    <<: *restricted
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/scheduler.mjs", "--mailer"]
    environment:
      DAR_ENV: staging
      APP_ORIGIN: ${STAGING_ORIGIN:-https://staging.wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      MAIL_WORKER_DATABASE_URL: postgresql://dar_mailer:${DAR_MAILER_PASSWORD:?set DAR_MAILER_PASSWORD}@db:5432/dar_staging
      SMTP_CONFIG_KEY: ${SMTP_CONFIG_KEY:?set SMTP_CONFIG_KEY}
      MAIL_ALLOWED_RECIPIENTS: ${MAIL_ALLOWED_RECIPIENTS:?set MAIL_ALLOWED_RECIPIENTS}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_ALERT_KEY: ${DAR_ALERT_KEY:-}
    tmpfs: ["/tmp:size=32m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/scheduler.mjs", "--mailer", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 45s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

  # One-time role creation on the empty database. Run with: docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    image: postgres:18-bookworm
    profiles: [bootstrap]
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: dar_admin
      PGDATABASE: dar_staging
      PGPASSWORD: ${DAR_DB_ADMIN_PASSWORD:-}
      DAR_OWNER_PASSWORD: ${DAR_OWNER_PASSWORD:-}
      DAR_RUNTIME_PASSWORD: ${DAR_RUNTIME_PASSWORD:-}
      DAR_IDENTITY_PASSWORD: ${DAR_IDENTITY_PASSWORD:-}
      DAR_WORKER_PASSWORD: ${DAR_WORKER_PASSWORD:-}
      DAR_MAILER_PASSWORD: ${DAR_MAILER_PASSWORD:-}
      DAR_BACKUP_PASSWORD: ${DAR_BACKUP_PASSWORD:-}
    volumes: ["./bootstrap-staging.sql:/bootstrap.sql:ro"]
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  # Schema migrations as the owner login, only on demand. Run after the bootstrap and after every deployment that adds a migration:
  #   docker compose --profile operator run --rm operator
  operator:
    <<: *restricted
    restart: "no"
    profiles: [operator]
    build: { context: ../.., target: operations }
    environment:
      MIGRATION_DATABASE_URL: postgresql://dar_owner:${DAR_OWNER_PASSWORD:-}@db:5432/dar_staging
    command: ["node", "node_modules/drizzle-kit/bin.cjs", "migrate"]
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    mem_limit: 384m
    pids_limit: 80

  # Encrypted backups of staging (database, media, configuration manifest). Optional but required for the first real restore test.
  backup:
    <<: *restricted
    restart: "no"
    profiles: [backup]
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/backup.mjs", "all"]
    environment:
      DAR_ENV: staging
      PUBLIC_SIGNUP_ENABLED: "false"
      DAR_RELEASE: ${DAR_RELEASE:-}
      BACKUP_DATABASE_URL: postgresql://dar_backup:${DAR_BACKUP_PASSWORD:-}@db:5432/dar_staging
      BACKUP_DIR: /backups
      BACKUP_KEY_ID: ${BACKUP_KEY_ID:-}
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_REGION: ${BACKUP_REGION:-us-east-1}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_SOURCE_BUCKET: ${S3_BUCKET:-}
      BACKUP_SOURCE_S3_ENDPOINT: ${S3_ENDPOINT:-}
      BACKUP_SOURCE_AWS_ACCESS_KEY_ID: ${S3_BACKUP_READ_ACCESS_KEY_ID:-}
      BACKUP_SOURCE_AWS_SECRET_ACCESS_KEY: ${S3_BACKUP_READ_SECRET_ACCESS_KEY:-}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_HEARTBEAT_URL: ${DAR_HEARTBEAT_URL:-}
    volumes: [backup_spool:/backups]
    tmpfs: ["/tmp:size=16m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64

  backup-check:
    <<: *restricted
    restart: "no"
    profiles: [backup]
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/backup.mjs", "check"]
    environment:
      DAR_ENV: staging
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_REGION: ${BACKUP_REGION:-us-east-1}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_SOURCE_BUCKET: ${S3_BUCKET:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
    tmpfs: ["/tmp:size=16m,uid=10001,gid=10001"]
    networks: [egress]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 48

networks:
  # Database traffic stays on this private network, which has no route to the internet.
  data: { internal: true }
  # This project's own outbound network (object storage, SMTP, alert webhooks). Not shared with other projects.
  egress: {}
  # Dokploy's shared Traefik network. Created by Dokploy. ONLY the app joins it, so no other service is reachable from other projects.
  dokploy-network: { external: true }

volumes:
  db_data: {}
  pdf_socket: {}
  backup_spool: {}
