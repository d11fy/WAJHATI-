# WAJHATI PRODUCTION for Dokploy (Docker Compose deployment) on wajhati.store.
#
# Same hardening and process separation as staging, but:
#   * its own project name, database (dar_production), volumes, network and secrets. Nothing is shared with staging;
#   * no edge login and no noindex header: this is the public site;
#   * mail is NOT restricted to an allow-list, so real merchants and customers receive email;
#   * the application refuses to start until LEGAL_APPROVED=true is set by the owner (scripts/ops/validate-env.mjs).
name: wajhati-production

x-restricted: &restricted
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  stop_grace_period: 25s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  app:
    <<: *restricted
    build: { context: ../.., target: app }
    environment:
      DAR_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-https://wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      LEGAL_APPROVED: ${LEGAL_APPROVED:-false}
      TRUSTED_CLIENT_IP_HEADER: x-real-ip
      DATABASE_URL: postgresql://dar_runtime:${DAR_RUNTIME_PASSWORD:?set DAR_RUNTIME_PASSWORD}@db:5432/dar_production
      IDENTITY_DATABASE_URL: postgresql://dar_identity:${DAR_IDENTITY_PASSWORD:?set DAR_IDENTITY_PASSWORD}@db:5432/dar_production
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET (dar-production-media-...)}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT (https)}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      S3_READY_KEY: ops/readiness
      AWS_ACCESS_KEY_ID: ${S3_APP_ACCESS_KEY_ID:?set S3_APP_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_APP_SECRET_ACCESS_KEY:?set S3_APP_SECRET_ACCESS_KEY}
      PLATFORM_MFA_KEY: ${PLATFORM_MFA_KEY:?set PLATFORM_MFA_KEY}
      PAYMENT_PROOF_ACTIVE_KEY: ${PAYMENT_PROOF_ACTIVE_KEY:?set PAYMENT_PROOF_ACTIVE_KEY}
      PAYMENT_PROOF_KEYRING: ${PAYMENT_PROOF_KEYRING:?set PAYMENT_PROOF_KEYRING}
      OPS_METRICS_TOKEN: ${OPS_METRICS_TOKEN:?set OPS_METRICS_TOKEN}
      SMTP_CONFIG_KEY: ${SMTP_CONFIG_KEY:?set SMTP_CONFIG_KEY}
      PAYMENT_RENDERER_SOCKET: /run/dar-pdf/worker.sock
    volumes:
      - pdf_socket:/run/dar-pdf:ro
    tmpfs:
      - "/tmp:size=64m,uid=10001,gid=10001"
      - "/app/.next/cache:size=64m,uid=10001,gid=10001"
    depends_on:
      db: { condition: service_healthy }
      pdf: { condition: service_healthy }
    networks: [data, egress, dokploy-network]
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTPS router. Basic auth first, so an unauthenticated visitor never reaches the application.
      - traefik.http.routers.wajhati-production.rule=Host(`wajhati.store`)
      - traefik.http.routers.wajhati-production.entrypoints=websecure
      - traefik.http.routers.wajhati-production.tls=true
      - traefik.http.routers.wajhati-production.tls.certresolver=letsencrypt
      - traefik.http.services.wajhati-production.loadbalancer.server.port=3000
      # Plain HTTP only redirects to HTTPS.
      - traefik.http.routers.wajhati-production-http.rule=Host(`wajhati.store`)
      - traefik.http.routers.wajhati-production-http.entrypoints=web
      - traefik.http.routers.wajhati-production-http.middlewares=wajhati-production-https
      - traefik.http.middlewares.wajhati-production-https.redirectscheme.scheme=https
      - traefik.http.middlewares.wajhati-production-https.redirectscheme.permanent=true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
    mem_limit: 768m
    cpus: 1
    pids_limit: 128

  pdf:
    <<: *restricted
    build: { context: ../.., target: pdf }
    network_mode: none
    environment:
      PAYMENT_RENDERER_SOCKET: /run/dar-pdf/worker.sock
    volumes: [pdf_socket:/run/dar-pdf]
    tmpfs: ["/tmp:size=16m,noexec,nosuid,nodev"]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/pdf-worker.mjs", "--health"]
      interval: 20s
      timeout: 3s
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 48

  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: dar_admin
      POSTGRES_PASSWORD: ${DAR_DB_ADMIN_PASSWORD:?set DAR_DB_ADMIN_PASSWORD}
      POSTGRES_DB: dar_production
    command: ["postgres", "-c", "max_connections=55", "-c", "shared_buffers=128MB", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0"]
    volumes: [db_data:/var/lib/postgresql]
    networks: [data]
    shm_size: 192m
    mem_limit: 1024m
    cpus: 1
    pids_limit: 128
    stop_grace_period: 45s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dar_admin -d dar_production"]
      interval: 10s
      timeout: 4s
      retries: 10

  # Media cleanup, order retention, billing expiry, maintenance. No mail secrets and no mail login.
  worker:
    <<: *restricted
    build: { context: ../.., target: operations }
    environment:
      DAR_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-https://wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      MEDIA_WORKER_DATABASE_URL: postgresql://dar_worker:${DAR_WORKER_PASSWORD:?set DAR_WORKER_PASSWORD}@db:5432/dar_production
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      AWS_ACCESS_KEY_ID: ${S3_WORKER_ACCESS_KEY_ID:?set S3_WORKER_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${S3_WORKER_SECRET_ACCESS_KEY:?set S3_WORKER_SECRET_ACCESS_KEY}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_ALERT_KEY: ${DAR_ALERT_KEY:-}
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/scheduler.mjs", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 45s
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 80

  # Sends the queued notification email through the owner-managed SMTP (or Resend). Its own database login and the SMTP key,
  # nothing else. Production mail is not restricted: it reaches real merchants and customers.
  mailer:
    <<: *restricted
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/scheduler.mjs", "--mailer"]
    environment:
      DAR_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:-https://wajhati.store}
      PUBLIC_SIGNUP_ENABLED: "false"
      MAIL_WORKER_DATABASE_URL: postgresql://dar_mailer:${DAR_MAILER_PASSWORD:?set DAR_MAILER_PASSWORD}@db:5432/dar_production
      SMTP_CONFIG_KEY: ${SMTP_CONFIG_KEY:?set SMTP_CONFIG_KEY}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_ALERT_KEY: ${DAR_ALERT_KEY:-}
    tmpfs: ["/tmp:size=32m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    healthcheck:
      test: ["CMD", "node", "scripts/ops/scheduler.mjs", "--mailer", "--health"]
      interval: 30s
      timeout: 3s
      start_period: 45s
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 64

  # One-time role creation on the empty database. Run with: docker compose --profile bootstrap run --rm bootstrap
  bootstrap:
    image: postgres:18-bookworm
    profiles: [bootstrap]
    restart: "no"
    environment:
      PGHOST: db
      PGUSER: dar_admin
      PGDATABASE: dar_production
      PGPASSWORD: ${DAR_DB_ADMIN_PASSWORD:-}
      DAR_OWNER_PASSWORD: ${DAR_OWNER_PASSWORD:-}
      DAR_RUNTIME_PASSWORD: ${DAR_RUNTIME_PASSWORD:-}
      DAR_IDENTITY_PASSWORD: ${DAR_IDENTITY_PASSWORD:-}
      DAR_WORKER_PASSWORD: ${DAR_WORKER_PASSWORD:-}
      DAR_MAILER_PASSWORD: ${DAR_MAILER_PASSWORD:-}
      DAR_BACKUP_PASSWORD: ${DAR_BACKUP_PASSWORD:-}
    volumes: ["./bootstrap-production.sql:/bootstrap.sql:ro"]
    command: ["psql", "-v", "ON_ERROR_STOP=1", "-f", "/bootstrap.sql"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]

  # Schema migrations as the owner login, only on demand. Run after the bootstrap and after every deployment that adds a migration:
  #   docker compose --profile operator run --rm operator
  operator:
    <<: *restricted
    restart: "no"
    profiles: [operator]
    build: { context: ../.., target: operations }
    environment:
      MIGRATION_DATABASE_URL: postgresql://dar_owner:${DAR_OWNER_PASSWORD:-}@db:5432/dar_production
    command: ["node", "node_modules/drizzle-kit/bin.cjs", "migrate"]
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    mem_limit: 384m
    pids_limit: 80

  # One-time creation of the first platform owner. The owner puts OWNER_EMAIL, OWNER_NAME and OWNER_PASSWORD in the Dokploy
  # environment (the password never appears in a command line or in this file), runs it once, then deletes OWNER_PASSWORD:
  #   docker compose --profile owner run --rm owner
  # It provisions the account, marks the email verified and assigns the owner role. MFA enrolment is a separate, mandatory step.
  owner:
    <<: *restricted
    restart: "no"
    profiles: [owner]
    build: { context: ../.., target: operations }
    environment:
      MIGRATION_DATABASE_URL: postgresql://dar_owner:${DAR_OWNER_PASSWORD:-}@db:5432/dar_production
      # Defaults, not `:?` guards: Compose interpolates every service in the file, so a required variable here would break
      # every deployment once the one-time values are removed. The scripts reject an empty email or password themselves.
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      OWNER_NAME: ${OWNER_NAME:-Owner}
      OWNER_PASSWORD: ${OWNER_PASSWORD:-}
    command:
      - sh
      - -c
      - >-
        printf '%s' "$$OWNER_PASSWORD" | node --conditions=react-server --import tsx scripts/billing-operator.ts provision-account "$$OWNER_EMAIL" "$$OWNER_NAME"
        && node --conditions=react-server --import tsx scripts/billing-operator.ts verify-email "$$OWNER_EMAIL"
        && node --conditions=react-server --import tsx scripts/platform-operator.ts bootstrap-owner "$$OWNER_EMAIL"
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    mem_limit: 384m
    pids_limit: 80

  # One-time issue of the owner's authenticator enrolment key (valid 30 minutes). The key goes in the Dokploy environment as
  # ENROLLMENT_KEY (43 characters, base64url), is read here from the environment and stored only as a digest. Run once, then
  # delete ENROLLMENT_KEY:   docker compose --profile mfa run --rm mfa
  mfa:
    <<: *restricted
    restart: "no"
    profiles: [mfa]
    build: { context: ../.., target: operations }
    environment:
      MIGRATION_DATABASE_URL: postgresql://dar_owner:${DAR_OWNER_PASSWORD:-}@db:5432/dar_production
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      ENROLLMENT_KEY: ${ENROLLMENT_KEY:-}
    command:
      - sh
      - -c
      - >-
        printf '%s' "$$ENROLLMENT_KEY" | node --conditions=react-server --import tsx scripts/platform-operator.ts issue-enrollment "$$OWNER_EMAIL"
    tmpfs: ["/tmp:size=48m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data]
    mem_limit: 384m
    pids_limit: 80

  # Encrypted backups of production (database, media, configuration manifest). Optional but required: a real restore test must pass before launch.
  backup:
    <<: *restricted
    restart: "no"
    profiles: [backup]
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/backup.mjs", "all"]
    environment:
      DAR_ENV: production
      PUBLIC_SIGNUP_ENABLED: "false"
      DAR_RELEASE: ${DAR_RELEASE:-}
      BACKUP_DATABASE_URL: postgresql://dar_backup:${DAR_BACKUP_PASSWORD:-}@db:5432/dar_production
      BACKUP_DIR: /backups
      BACKUP_KEY_ID: ${BACKUP_KEY_ID:-}
      BACKUP_KEY: ${BACKUP_KEY:-}
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_REGION: ${BACKUP_REGION:-us-east-1}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_SOURCE_BUCKET: ${S3_BUCKET:-}
      BACKUP_SOURCE_S3_ENDPOINT: ${S3_ENDPOINT:-}
      BACKUP_SOURCE_AWS_ACCESS_KEY_ID: ${S3_BACKUP_READ_ACCESS_KEY_ID:-}
      BACKUP_SOURCE_AWS_SECRET_ACCESS_KEY: ${S3_BACKUP_READ_SECRET_ACCESS_KEY:-}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
      DAR_HEARTBEAT_URL: ${DAR_HEARTBEAT_URL:-}
    volumes: [backup_spool:/backups]
    tmpfs: ["/tmp:size=16m,uid=10001,gid=10001"]
    depends_on:
      db: { condition: service_healthy }
    networks: [data, egress]
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 64

  backup-check:
    <<: *restricted
    restart: "no"
    profiles: [backup]
    build: { context: ../.., target: operations }
    command: ["node", "scripts/ops/backup.mjs", "check"]
    environment:
      DAR_ENV: production
      BACKUP_BUCKET: ${BACKUP_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_FORCE_PATH_STYLE: ${BACKUP_S3_FORCE_PATH_STYLE:-true}
      BACKUP_REGION: ${BACKUP_REGION:-us-east-1}
      BACKUP_AWS_ACCESS_KEY_ID: ${BACKUP_AWS_ACCESS_KEY_ID:-}
      BACKUP_AWS_SECRET_ACCESS_KEY: ${BACKUP_AWS_SECRET_ACCESS_KEY:-}
      BACKUP_SOURCE_BUCKET: ${S3_BUCKET:-}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      DAR_ALERT_WEBHOOK: ${DAR_ALERT_WEBHOOK:-}
    tmpfs: ["/tmp:size=16m,uid=10001,gid=10001"]
    networks: [egress]
    mem_limit: 192m
    cpus: 0.25
    pids_limit: 48

networks:
  # Database traffic stays on this private network, which has no route to the internet.
  data: { internal: true }
  # This project's own outbound network (object storage, SMTP, alert webhooks). Not shared with other projects.
  egress: {}
  # Dokploy's shared Traefik network. Created by Dokploy. ONLY the app joins it, so no other service is reachable from other projects.
  dokploy-network: { external: true }

volumes:
  db_data: {}
  pdf_socket: {}
  backup_spool: {}
